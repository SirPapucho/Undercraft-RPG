[COLLECT_COINS_BUTTON]
	#X position for coin button
	#Tips: 80 for align for right side
	# Default: 0
	# Range: > -2147483648
	xCollectCoins = 0
	#Y position for coin button
	# Default: 0
	# Range: > -2147483648
	yCollectCoins = 0
	#Enable convert buttons on collect coins button
	enableConvertButtons = true
	#X position for coin button in creative mode
	#Tips: 80 for align for right side
	# Default: 0
	# Range: > -2147483648
	xCollectCoinsCreative = 0
	#Y position for coin button in creative mode
	# Default: 0
	# Range: > -2147483648
	yCollectCoinsCreative = 0

